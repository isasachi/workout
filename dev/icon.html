<!doctype html><html><head><meta charset="utf-8"><style>
:root{--demo-floor:transparent;--demo-fig:#b8f23f;--demo-fig-far:#5f7d27;--demo-focus:#b8f23f;--demo-focus-far:#5f7d27}
html,body{margin:0;background:#000}
#root{width:512px;height:512px;display:grid;place-items:center;background:#000}
svg{width:430px;height:383px}
</style></head><body><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { Figure } from '../src/demo/Figure';
import { solve } from '../src/demo/rig';
import { loadMove } from '../src/demo/registry';
loadMove('lunge-forward').then((m) => {
  const pose = m.keys[1].pose;
  const move = { ...m, frame: [-66, -24, 196], focus: [] };
  createRoot(document.getElementById('root')).render(React.createElement(Figure, { move, j: solve(pose, 'side') }));
});
</script></body></html>
